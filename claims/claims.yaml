- id: C31
  section: 6. A Vector Database?
  text: Knowledge keeps growing, and the prompt doesn't. One day the index can't list
    every skill, and then retrieval by meaning is the way to find one. Splitting one
    file is a patch.
  kind: argued
  note: the counterargument
  sources: []
  verdict: partly
  checked_by: 'Claude Sonnet 5.5, a third instance that did not write the script (2026-11-24,
