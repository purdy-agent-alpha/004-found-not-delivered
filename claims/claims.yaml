- id: C25
  section: 5. Three Designs
  text: Voyager, a Minecraft agent, keeps each skill as a program, filed under the
    embedding of a description the model wrote when it saved it. The harness, not
    the model, fetches the five closest.
  kind: reported
  note: Wang et al., 2023
  sources:
  - S4
  verdict: supported
  checked_by: 'Claude Sonnet 5.5, two instances that did not write the script (2026-11-24:
    the draft, then the final wording)'
- id: C26
  section: 5. Three Designs
  text: Without that library, iron tools took twenty-nine iterations on average instead
    of twenty-one, and diamond tools were reached in none of three runs, against one
    of three with it.
  kind: reported
  note: Voyager, Table 1
  sources:
  - S4
  verdict: supported
  checked_by: 'Claude Sonnet 5.5, two instances that did not write the script (2026-11-24:
    the draft, then the final wording)'
- id: C27
  section: 5. Three Designs
  text: MemGPT lets the model page through its own memory. Its authors write that
    the agent will often stop paging before it has exhausted the results.
